<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self';"
    />
    <meta http-equiv="refresh" content="0; url=../privacy.html" />
    <link rel="canonical" href="https://npsomewhere.com/privacy.html" />
    <title>Somewhere — Privacy Policy</title>
  </head>
  <body>
    <p data-i18n="legal.redirect.title">개인정보처리방침으로 이동 중이에요</p>
    <p><a href="../privacy.html" data-i18n="legal.redirect.open">개인정보처리방침 열기</a></p>
    <script src="../assets/js/i18n.js?v=20260909-i18n"></script>
    <script>
      if (window.SomewhereI18N) {
        const lang = window.SomewhereI18N.detectLang();
        window.SomewhereI18N.applyLang(lang);
        document.title = `Somewhere — ${window.SomewhereI18N.get("legal.redirect.title", lang)}`;
      }
      window.location.replace("../privacy.html");
    </script>
  </body>
</html>
