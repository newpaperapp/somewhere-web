<!DOCTYPE html>
<!-- Shared frame for features/<slug>/<lang>.html; scripts/build-site.py fills every {{placeholder}}. -->
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; base-uri 'self'; form-action 'self';"
    />

    <link rel="canonical" href="{{url}}" />
    {{alternates}}

    <meta property="og:site_name" content="Somewhere" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="https://npsomewhere.com/assets/img/og-image.jpg" />
    <meta property="og:locale" content="{{locale}}" />
    {{locale_alternates}}

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="https://npsomewhere.com/assets/img/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/assets/img/app-icon.svg" />
    <link rel="stylesheet" href="/assets/css/fonts.css" />
    <link rel="stylesheet" href="/assets/css/style.css?v=20261029-svg-icons" />

    <script>
      try {
        const savedTheme = localStorage.getItem("somewhere-theme");
        const theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (_) {}
    </script>

    <script type="application/ld+json">{{schema}}</script>
  </head>
  <body>
    <header class="nav">
      <div class="container nav__inner">
        <a class="brand" href="{{home}}" aria-label="Somewhere">
          <img class="logo" src="/assets/img/app-icon.svg" alt="" />
          <span>Somewhere</span>
        </a>

        <nav class="nav__actions">
          <label class="language-picker">
            <svg class="language-picker__icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z" /></svg>
            <span class="language-picker__value" aria-hidden="true">{{language_name}}</span>
            <select class="language-picker__select" data-feature-language aria-label="{{language_label}}">
              {{language_options}}
            </select>
          </label>
          <button class="icon-btn" data-action="toggle-theme" data-theme-icon aria-label="{{theme_label}}">
            <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
            </svg>
            <svg class="ico-moon hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        </nav>
      </div>
    </header>

    {{main}}

    <footer class="footer">
      <div class="container footer__inner">
        <div>
          <a class="brand" href="{{home}}" aria-label="Somewhere">
            <img class="logo" src="/assets/img/app-icon.svg" alt="" />
            <span>Somewhere</span>
          </a>
          <p class="footer__meta">
            <span>{{footer_contact}}</span>:
            <span class="contact-email" data-contact-email>contact@npsomewhere.com</span>
          </p>
        </div>

        <div class="footer__links">
          <a href="/notices/">{{footer_notices}}</a>
          <a href="/whats-new/">{{footer_whats_new}}</a>
          <a href="{{privacy}}">{{footer_privacy}}</a>
          <a href="{{terms}}">{{footer_terms}}</a>
          <span class="footer__meta">© 2026 Somewhere</span>
        </div>

        <details class="footer__business">
          <summary>{{footer_business}}</summary>
          <div class="footer__business-body">{{footer_business_info}}</div>
        </details>
      </div>
      <p class="footer__legal">{{footer_legal}}</p>
    </footer>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/main.js?v=20260926-seo"></script>
    <script>
      document.querySelectorAll("[data-feature-language]").forEach((select) => {
        select.addEventListener("change", () => {
          // Same explicit choice the landing pages record, so the home page follows it.
          try { localStorage.setItem("somewhere-lang-explicit", select.value); } catch (_) {}
          window.location.assign(select.selectedOptions[0].dataset.href);
        });
      });
    </script>
  </body>
</html>
